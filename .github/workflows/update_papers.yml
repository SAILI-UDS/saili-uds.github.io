name: Update Papers from Google Scholar

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 2am UTC
  workflow_dispatch:

jobs:
  update-papers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install scholarly bibtexparser

      - name: Update papers.bib
        run: python scripts/update_papers_bib.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _bibliography/papers.bib
          git diff --cached --quiet || git commit -m "Update papers.bib from Google Scholar"
          git push
